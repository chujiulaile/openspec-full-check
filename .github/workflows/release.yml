name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --global @studyzy/openspec-cn@1.8.0
      - run: npm run check
      - run: npm run verify:release
      - name: Build package
        run: npm pack --json > pack-result.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_FILE=$(node -e "const r=require('./pack-result.json'); process.stdout.write(r[0].filename)")
          gh release create "${GITHUB_REF_NAME}" "${PACKAGE_FILE}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
